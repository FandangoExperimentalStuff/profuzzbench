
declare -A OPTS IMAGE

TARGETS_ALL="lightftp bftpd proftpd pure-ftpd exim dnsmasq live555 kamailio openssh dcmtk forked-daapd"

# Images: aflnet/aflnwe run in the base image, stateafl in the <target>-stateafl image
for t in $TARGETS_ALL; do
  IMAGE[$t,aflnet]=$t
  IMAGE[$t,aflnwe]=$t
  IMAGE[$t,stateafl]=$t-stateafl
done

E=/home/ubuntu/experiments

##### FTP #####
OPTS[lightftp,aflnet]="-P FTP -D 10000 -q 3 -s 3 -E -K -m none -t ${TEST_TIMEOUT}+"
OPTS[lightftp,stateafl]="-P FTP -D 10000 -q 3 -s 3 -E -K -m none -u $E/LightFTP/Source/Release/fftp -t ${TEST_TIMEOUT}+"
OPTS[lightftp,aflnwe]="-D 10000 -K -m none -t ${TEST_TIMEOUT}+"

OPTS[bftpd,aflnet]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -t ${TEST_TIMEOUT}+"
OPTS[bftpd,stateafl]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -u $E/bftpd/bftpd -t ${TEST_TIMEOUT}+"
OPTS[bftpd,aflnwe]="-m none -D 10000 -K -t ${TEST_TIMEOUT}+"

OPTS[proftpd,aflnet]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -t ${TEST_TIMEOUT}+"
OPTS[proftpd,stateafl]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -u $E/proftpd/proftpd -t ${TEST_TIMEOUT}+"
OPTS[proftpd,aflnwe]="-m none -D 10000 -K -t ${TEST_TIMEOUT}+"

OPTS[pure-ftpd,aflnet]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -t ${TEST_TIMEOUT}+"
OPTS[pure-ftpd,stateafl]="-m none -P FTP -D 10000 -q 3 -s 3 -E -K -u $E/pure-ftpd/src/pure-ftpd -t ${TEST_TIMEOUT}+"
OPTS[pure-ftpd,aflnwe]="-m none -D 10000 -K -t ${TEST_TIMEOUT}+"

##### SMTP #####
OPTS[exim,aflnet]="-P SMTP -D 10000 -q 3 -s 3 -E -K -W 100 -m none -t ${TEST_TIMEOUT}+"
OPTS[exim,stateafl]="-P SMTP -D 10000 -q 3 -s 3 -E -K -W 100 -m none -u $E/exim/src/build-Linux-x86_64/exim -t ${TEST_TIMEOUT}+"
OPTS[exim,aflnwe]="-D 10000 -K -W 100 -m none -t ${TEST_TIMEOUT}+"

##### DNS #####
OPTS[dnsmasq,aflnet]="-P DNS -D 10000 -K -R -q 3 -s 3 -E -m none -t ${TEST_TIMEOUT}+"
OPTS[dnsmasq,stateafl]="-P DNS -D 10000 -K -R -q 3 -s 3 -E -m none -u $E/dnsmasq/src/dnsmasq -t ${TEST_TIMEOUT}+"
OPTS[dnsmasq,aflnwe]="-D 10000 -K -m none -t ${TEST_TIMEOUT}+"

##### RTSP #####
OPTS[live555,aflnet]="-P RTSP -D 10000 -q 3 -s 3 -E -K -R -m none -t ${TEST_TIMEOUT}+"
OPTS[live555,stateafl]="-P RTSP -D 10000 -q 3 -s 3 -E -K -R -m none -u $E/live555/testProgs/testOnDemandRTSPServer -t ${TEST_TIMEOUT}+"
OPTS[live555,aflnwe]="-D 10000 -K -m none -t ${TEST_TIMEOUT}+"

##### SIP #####
OPTS[kamailio,aflnet]="-m none -P SIP -l 5061 -D 50000 -q 3 -s 3 -E -K -t ${TEST_TIMEOUT}+"
OPTS[kamailio,stateafl]="-m none -P SIP -l 5061 -D 50000 -q 3 -s 3 -E -K -u $E/kamailio/src/kamailio -U $E/kamailio/ -t ${TEST_TIMEOUT}+"
OPTS[kamailio,aflnwe]="-m none -D 50000 -K -t ${TEST_TIMEOUT}+"

##### SSH #####
OPTS[openssh,aflnet]="-P SSH -D 10000 -q 3 -s 3 -E -K -W 10 -m none -t ${TEST_TIMEOUT}+"
OPTS[openssh,stateafl]="-P SSH -D 10000 -q 3 -s 3 -E -K -W 10 -l 30000 -e 20000 -m none -u $E/openssh/sshd -t ${TEST_TIMEOUT}+"
OPTS[openssh,aflnwe]="-D 10000 -K -W 10 -m none -t ${TEST_TIMEOUT}+"

##### DICOM #####
OPTS[dcmtk,aflnet]="-P DICOM -D 10000 -E -K -m none -t ${TEST_TIMEOUT}+"
OPTS[dcmtk,stateafl]="-P DICOM -D 10000 -E -K -m none -u $E/dcmtk/build/bin/dcmqrscp -t ${TEST_TIMEOUT}+"
OPTS[dcmtk,aflnwe]="-D 10000 -K -m none -t ${TEST_TIMEOUT}+"

##### DAAPD #####
OPTS[forked-daapd,aflnet]="-P HTTP -D 200000 -m none -q 3 -s 3 -E -K -t ${TEST_TIMEOUT}+"
OPTS[forked-daapd,stateafl]="-P HTTP -D 200000 -m none -q 3 -s 3 -E -K -u $E/forked-daapd/src/forked-daapd -t ${TEST_TIMEOUT}+"
OPTS[forked-daapd,aflnwe]="-D 200000 -m none -K -t ${TEST_TIMEOUT}+"